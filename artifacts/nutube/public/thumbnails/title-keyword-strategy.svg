<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
        <!-- 돋보기 -->
        <g transform="translate(440, 130)">
          <circle cx="160" cy="160" r="110" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="10"/>
          <line x1="240" y1="240" x2="320" y2="320" stroke="rgba(255,255,255,0.6)" stroke-width="14" stroke-linecap="round"/>
          <!-- 돋보기 안 키워드 -->
          <text x="160" y="150" font-size="32" font-weight="800" fill="#fbbf24" text-anchor="middle">키워드</text>
          <text x="160" y="190" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">검색량</text>
        </g>
        
  <text x="600" y="490" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif" letter-spacing="-0.02em">제목 키워드 전략</text>
  <text x="600" y="555" font-size="28" font-weight="400" fill="#ffffff" opacity="0.8" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif">검색 + 클릭 둘 다 잡기</text>
</svg>