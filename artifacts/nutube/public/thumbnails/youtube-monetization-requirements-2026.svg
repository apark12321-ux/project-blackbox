<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
        <!-- 단계 1, 2 카드 -->
        <g transform="translate(280, 160)">
          <rect x="0" y="0" width="280" height="180" rx="14" fill="rgba(255,255,255,0.3)" stroke="#92400e" stroke-width="3"/>
          <text x="140" y="50" font-size="32" font-weight="900" fill="#1f2937" text-anchor="middle">1단계</text>
          <text x="140" y="100" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">500명 + 3000h</text>
          <text x="140" y="140" font-size="18" fill="#92400e" text-anchor="middle">시청자 후원</text>
          <rect x="360" y="0" width="280" height="180" rx="14" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
          <text x="500" y="50" font-size="32" font-weight="900" fill="#1f2937" text-anchor="middle">2단계</text>
          <text x="500" y="100" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">1000명 + 4000h</text>
          <text x="500" y="140" font-size="18" font-weight="800" fill="#92400e" text-anchor="middle">광고 수익</text>
        </g>
        
  <text x="600" y="490" font-size="56" font-weight="900" fill="#1f2937" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif" letter-spacing="-0.02em">2026 수익화 요건</text>
  <text x="600" y="555" font-size="28" font-weight="400" fill="#1f2937" opacity="0.8" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif">YPP 진입 조건</text>
</svg>