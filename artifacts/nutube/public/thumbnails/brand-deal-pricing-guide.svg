<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
        <!-- 단계별 차트 -->
        <g transform="translate(220, 150)">
          
          <rect x="0" y="140" width="140" height="80" rx="8" fill="#fef3c7"/>
          <text x="70" y="245" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1만↓</text>
          
          <rect x="180" y="80" width="140" height="140" rx="8" fill="#fcd34d"/>
          <text x="250" y="245" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1~10만</text>
          
          <rect x="360" y="20" width="140" height="200" rx="8" fill="#fbbf24"/>
          <text x="430" y="245" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">10~50만</text>
          
          <rect x="540" y="-20" width="140" height="240" rx="8" fill="#f59e0b"/>
          <text x="610" y="245" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">50만↑</text>
          
          <text x="780" y="100" font-size="50" font-weight="900" fill="#fef3c7">₩</text>
        </g>
        
  <text x="600" y="490" font-size="56" font-weight="900" fill="#1f2937" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif" letter-spacing="-0.02em">협찬 단가 가이드</text>
  <text x="600" y="555" font-size="28" font-weight="400" fill="#1f2937" opacity="0.8" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif">구독자 규모별 적정선</text>
</svg>