<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
        <!-- 시청 유지 그래프 -->
        <g transform="translate(220, 160)">
          <rect x="0" y="0" width="760" height="220" rx="12" fill="rgba(255,255,255,0.08)"/>
          <!-- 영역 -->
          <path d="M 0 40 L 150 60 L 300 100 L 500 130 L 760 180 L 760 220 L 0 220 Z"
                fill="rgba(251,191,36,0.3)"/>
          <path d="M 0 40 L 150 60 L 300 100 L 500 130 L 760 180"
                stroke="#fbbf24" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- 구간 -->
          <line x1="150" y1="0" x2="150" y2="220" stroke="rgba(255,255,255,0.4)" stroke-dasharray="6 6"/>
          <line x1="600" y1="0" x2="600" y2="220" stroke="rgba(255,255,255,0.4)" stroke-dasharray="6 6"/>
          <text x="75" y="245" font-size="20" fill="#fff" text-anchor="middle" opacity="0.8">A</text>
          <text x="375" y="245" font-size="20" fill="#fff" text-anchor="middle" opacity="0.8">B</text>
          <text x="680" y="245" font-size="20" fill="#fff" text-anchor="middle" opacity="0.8">C</text>
        </g>
        
  <text x="600" y="490" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif" letter-spacing="-0.02em">시청 지속 30→50%</text>
  <text x="600" y="555" font-size="28" font-weight="400" fill="#ffffff" opacity="0.8" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif">3구간 분리 분석법</text>
</svg>