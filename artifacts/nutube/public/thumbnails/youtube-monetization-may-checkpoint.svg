      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 점검 체크리스트 + 막대 차트 -->
  <g transform="translate(360, 140)">
    <rect x="0" y="0" width="240" height="200" rx="16" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <g transform="translate(28,38)">
      <circle cx="0" cy="0" r="13" fill="#fff"/><path d="M-6,0 L-2,5 L7,-6" stroke="#ca8a04" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="28" y="-6" width="150" height="11" rx="5" fill="#fff" opacity="0.55"/>
    </g>
    <g transform="translate(28,88)">
      <circle cx="0" cy="0" r="13" fill="#fff"/><path d="M-6,0 L-2,5 L7,-6" stroke="#ca8a04" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="28" y="-6" width="150" height="11" rx="5" fill="#fff" opacity="0.55"/>
    </g>
    <g transform="translate(28,138)">
      <circle cx="0" cy="0" r="13" fill="#fff" opacity="0.5"/>
