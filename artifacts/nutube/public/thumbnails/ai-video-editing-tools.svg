<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#overlay)"/>
  
  <!-- 카테고리 배지 -->
  <rect x="80" y="80" width="180" height="44" rx="22" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="170" y="109" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">AI TOOLS</text>
  
  <!-- 이모지 (우측) -->
  <text x="1050" y="380" font-size="220" text-anchor="middle" opacity="0.85">🤖</text>
  
  <!-- 제목 -->
  <text x="80" y="245" font-family="Pretendard, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">AI 영상 편집 도구 - 자동 자막부터</text>
        <text x="80" y="321" font-family="Pretendard, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">컷 편집까지</text>
  
  <!-- 하단 푸터 -->
  <rect x="80" y="530" width="1040" height="2" fill="rgba(255,255,255,0.3)"/>
  <text x="80" y="575" font-family="Pretendard, sans-serif" font-size="22" font-weight="600" fill="#ffffff" opacity="0.95">NuTube · 유튜브 채널 운영 가이드</text>
</svg>