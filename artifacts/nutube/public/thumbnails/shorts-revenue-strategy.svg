<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
        <!-- 쇼츠 화면 + 코인 -->
        <g transform="translate(440, 160)">
          <rect x="80" y="0" width="160" height="280" rx="20" fill="rgba(255,255,255,0.25)" stroke="#92400e" stroke-width="3"/>
          <circle cx="160" cy="140" r="32" fill="#fff" opacity="0.7"/>
          <polygon points="148,124 148,156 180,140" fill="#92400e"/>
          <!-- 작은 코인들 -->
          <g font-family="Apple Color Emoji,Segoe UI Emoji,sans-serif">
            <text x="-50" y="60" font-size="48">🪙</text>
            <text x="280" y="100" font-size="48">🪙</text>
            <text x="-30" y="200" font-size="48">🪙</text>
            <text x="300" y="220" font-size="48">🪙</text>
          </g>
        </g>
        
  <text x="600" y="490" font-size="56" font-weight="900" fill="#1f2937" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif" letter-spacing="-0.02em">쇼츠 수익화 현실</text>
  <text x="600" y="555" font-size="28" font-weight="400" fill="#1f2937" opacity="0.8" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif">기대치와 전략</text>
</svg>