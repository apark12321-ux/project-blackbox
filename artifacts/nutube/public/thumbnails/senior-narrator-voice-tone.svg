<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
        <!-- 마이크 + 음파 -->
        <g transform="translate(440, 170)">
          <rect x="140" y="0" width="80" height="120" rx="40" fill="rgba(255,255,255,0.85)"/>
          <line x1="180" y1="120" x2="180" y2="160" stroke="rgba(255,255,255,0.85)" stroke-width="8"/>
          <line x1="150" y1="160" x2="210" y2="160" stroke="rgba(255,255,255,0.85)" stroke-width="8" stroke-linecap="round"/>
          <!-- 음파 -->
          <path d="M 30 60 Q 50 0 90 60 Q 50 120 30 60" fill="none" stroke="#fef3c7" stroke-width="4"/>
          <path d="M 0 60 Q 30 -30 90 60 Q 30 150 0 60" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
          <path d="M 280 60 Q 310 0 350 60 Q 310 120 280 60" fill="none" stroke="#fef3c7" stroke-width="4"/>
          <path d="M 280 60 Q 320 -30 380 60 Q 320 150 280 60" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
        </g>
        
  <text x="600" y="490" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif" letter-spacing="-0.02em">내레이션 톤 만들기</text>
  <text x="600" y="555" font-size="28" font-weight="400" fill="#ffffff" opacity="0.8" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif">듣기 편한 목소리</text>
</svg>