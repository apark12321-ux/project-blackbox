<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
        <!-- 두 지표 비교 -->
        <g transform="translate(310, 170)">
          <rect x="0" y="0" width="260" height="180" rx="14" fill="rgba(255,255,255,0.3)" stroke="#92400e" stroke-width="3"/>
          <text x="130" y="60" font-size="48" font-weight="900" fill="#1f2937" text-anchor="middle">CPM</text>
          <text x="130" y="110" font-size="18" fill="#1f2937" text-anchor="middle">광고주 → 유튜브</text>
          <text x="130" y="150" font-size="22" font-weight="800" fill="#92400e" text-anchor="middle">$7.5</text>
          <text x="300" y="90" font-size="40" font-weight="900" fill="#fef3c7" text-anchor="middle">→</text>
          <rect x="340" y="0" width="260" height="180" rx="14" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
          <text x="470" y="60" font-size="48" font-weight="900" fill="#1f2937" text-anchor="middle">RPM</text>
          <text x="470" y="110" font-size="18" fill="#1f2937" text-anchor="middle">실수령액</text>
          <text x="470" y="150" font-size="22" font-weight="800" fill="#92400e" text-anchor="middle">≈ 30%</text>
        </g>
        
  <text x="600" y="490" font-size="56" font-weight="900" fill="#1f2937" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif" letter-spacing="-0.02em">CPM vs RPM</text>
  <text x="600" y="555" font-size="28" font-weight="400" fill="#1f2937" opacity="0.8" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif">광고 수익 핵심 지표</text>
</svg>