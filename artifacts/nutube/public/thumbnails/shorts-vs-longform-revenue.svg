<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
        <!-- 두 막대 비교 -->
        <g transform="translate(300, 150)">
          <!-- 쇼츠 -->
          <text x="100" y="40" font-size="24" font-weight="800" fill="#1f2937" text-anchor="middle">쇼츠</text>
          <rect x="50" y="60" width="100" height="60" rx="6" fill="rgba(255,255,255,0.4)"/>
          <text x="100" y="100" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">200원</text>
          <!-- vs -->
          <text x="300" y="120" font-size="40" font-weight="900" fill="#92400e" text-anchor="middle">VS</text>
          <!-- 롱폼 -->
          <text x="500" y="40" font-size="24" font-weight="800" fill="#1f2937" text-anchor="middle">롱폼</text>
          <rect x="430" y="60" width="140" height="220" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
          <text x="500" y="180" font-size="22" font-weight="900" fill="#92400e" text-anchor="middle">3,000원</text>
          <text x="500" y="220" font-size="16" fill="#92400e" text-anchor="middle">15배</text>
        </g>
        
  <text x="600" y="490" font-size="56" font-weight="900" fill="#1f2937" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif" letter-spacing="-0.02em">쇼츠 vs 롱폼</text>
  <text x="600" y="555" font-size="28" font-weight="400" fill="#1f2937" opacity="0.8" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif">시간 대비 ROI</text>
</svg>