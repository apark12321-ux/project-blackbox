<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 세로 쇼츠 화면 + 재시청 순환 -->
  <g transform="translate(480, 120)">
    <rect x="0" y="0" width="140" height="230" rx="22" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.42)" stroke-width="3"/>
    <polygon points="55,90 55,150 105,120" fill="#fff"/>
    <!-- 순환 화살표 -->
    <g transform="translate(70, 115)">
      <path d="M 130 0 A 130 130 0 1 1 -92 92" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="7" stroke-linecap="round"/>
      <polygon points="-92,68 -78,100 -112,96" fill="#fff"/>
    </g>
  </g>
  <text x="600" y="490" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif" letter-spacing="-0.02em">쇼츠 재시청률</text>
  <text x="600" y="555" font-size="28" font-weight="400" fill="#ffffff" opacity="0.8" text-anchor="middle" font-family="Pretendard,system-ui,-apple-system,sans-serif">2026년 핵심 신호</text>
</svg>