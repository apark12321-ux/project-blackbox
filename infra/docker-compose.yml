version: "3.9"

# ═══════════════════════════════════════════════
# Project Blackbox — Docker Compose
# ═══════════════════════════════════════════════
# 5 modules + PostgreSQL + Redis + Nginx
#
# Usage:
#   docker-compose up -d              # Start all
#   docker-compose up -d --scale video_worker=2  # Scale GPU workers
#   docker-compose logs -f api        # View API logs

services:
  # ── Data Layer ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackbox_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-blackbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbox"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Server (Module A + B + D) ──
  # CPU-light modules share one FastAPI server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://blackbox:blackbox_secure_2026@postgres:5432/blackbox
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - output:/app/output
      - assets:/app/assets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Video Editor API (Module B-2) ──
  # Separate service for GPU-heavy rendering
  video_api:
    build:
      context: .
      dockerfile: Dockerfile.video
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://blackbox:blackbox_secure_2026@postgres:5432/blackbox
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - output:/app/output
      - assets:/app/assets

  # ── Celery Workers ──
  video_worker:
    build:
      context: .
      dockerfile: Dockerfile.video
    command: celery -A infra.celery_worker worker -Q video_queue -c 2 --loglevel=info -n video@%h
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://blackbox:blackbox_secure_2026@postgres:5432/blackbox
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - output:/app/output
      - assets:/app/assets
    # GPU 인스턴스에서 실행 시:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  shield_worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A infra.celery_worker worker -Q shield_queue -c 4 --loglevel=info -n shield@%h
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - output:/app/output

  default_worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A infra.celery_worker worker -Q default_queue -c 8 --loglevel=info -n default@%h
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - video_api

  # ── Celery Beat (스케줄러) ──
  beat:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A infra.celery_worker beat --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  output:
  assets:
