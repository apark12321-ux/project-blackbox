upstream api_backend {
    server api:8000;
}
upstream video_backend {
    server video_api:8001;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 500M;

    # Module A, B, C, D APIs
    location /api/v1/categories  { proxy_pass http://api_backend; }
    location /api/v1/keywords    { proxy_pass http://api_backend; }
    location /api/v1/news        { proxy_pass http://api_backend; }
    location /api/v1/submit      { proxy_pass http://api_backend; }
    location /api/v1/script      { proxy_pass http://api_backend; }
    location /api/v1/shield      { proxy_pass http://api_backend; }
    location /api/v1/publish     { proxy_pass http://api_backend; }

    # Module B-2 API (separate GPU server)
    location /api/v1/video-edit  { proxy_pass http://video_backend; }

    # Health checks
    location /health             { proxy_pass http://api_backend; }
    location /health/video       { proxy_pass http://video_backend; }

    # Static output files
    location /output/ {
        alias /app/output/;
        autoindex off;
    }

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
